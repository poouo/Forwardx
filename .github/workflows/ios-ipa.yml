name: iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: forwardx-release-ios-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-ios-ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check versions, types and mobile build tests
        env:
          FORWARDX_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          pnpm check:versions
          pnpm exec tsc --noEmit
          pnpm test:ios

      - name: Build unsigned device IPA
        run: pnpm mobile:ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: forwardx-ios-ipa
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 30

      - name: Explain signing requirements
        run: |
          echo '### ForwardX iOS IPA' >> "$GITHUB_STEP_SUMMARY"
          echo 'Unsigned arm64 IPA for iOS 15+. Sign with your own certificate/profile or sideloading tool before installing. No Apple secrets are required. This does not publish to App Store/TestFlight.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Manual runs: download forwardx-ios-ipa from Actions artifacts. Tag builds: also attached to the corresponding panel Release.' >> "$GITHUB_STEP_SUMMARY"

  publish-ios-ipa:
    needs: build-ios-ipa
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: forwardx-ios-ipa
          path: dist/ios

      - name: Upload to existing panel Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/ios/*.ipa dist/ios/*.sha256 dist/ios/README-IOS-SIGNING.txt)
          ipa_files=(dist/ios/*.ipa)
          if [ "${#ipa_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one unsigned IPA"
            exit 1
          fi
          # The panel workflow owns Release creation and changelog; never create an empty Release here.
          for attempt in $(seq 1 120); do
            if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 120 ]; then
              echo "::error::Panel Release $RELEASE_VERSION was not created within 30 minutes. IPA remains available in Actions artifacts."
              exit 1
            fi
            sleep 15
          done
          for attempt in $(seq 1 5); do
            if gh release upload "$RELEASE_VERSION" "${files[@]}" --clobber; then exit 0; fi
            sleep $((attempt * 8))
          done
          echo "::error::IPA upload failed; download the Actions artifact to recover the built package."
          exit 1
