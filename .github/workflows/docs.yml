name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build VitePress docs
        env:
          VITEPRESS_BASE: ${{ vars.VITEPRESS_BASE || format('/{0}/', github.event.repository.name) }}
        run: pnpm docs:build

      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="docs/.vitepress/dist"
          if [ ! -d "$artifact_dir" ]; then
            echo "::error::Pages artifact directory does not exist: $artifact_dir"
            exit 1
          fi
          if [ ! -f "$artifact_dir/index.html" ]; then
            echo "::error::Pages artifact is missing index.html: $artifact_dir/index.html"
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const info = JSON.parse(fs.readFileSync("docs/.vitepress/dist/build-info.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            assert.equal(info.version, pkg.version);
            assert.equal(info.commit, process.env.GITHUB_SHA);
            for (const page of ["guide/index.html", "guide/interface.html", "guide/releases.html", "guide/rules.html", "guide/mobile-app.html"]) {
              assert.ok(fs.statSync(`docs/.vitepress/dist/${page}`).size > 0, page);
            }
            console.log(`Validated docs v${info.version} at ${info.commit}`);
          '
          file_count="$(find "$artifact_dir" -type f | wc -l | tr -d '[:space:]')"
          total_bytes="$(du -sb "$artifact_dir" | awk '{print $1}')"
          echo "Pages artifact directory: $artifact_dir"
          echo "Pages artifact files: $file_count"
          echo "Pages artifact bytes: $total_bytes"
          if [ "$file_count" -le 0 ]; then
            echo "::error::Pages artifact is empty: $artifact_dir"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000

      - name: Verify published docs version
        env:
          DOCS_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const url = new URL("build-info.json", process.env.DOCS_URL.replace(/\/?$/, "/"));
          let lastError;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              url.searchParams.set("verify", `${process.env.EXPECTED_COMMIT}-${attempt}`);
              const response = await fetch(url, { cache: "no-store", signal: AbortSignal.timeout(15000) });
              assert.ok(response.ok, `HTTP ${response.status}`);
              const info = await response.json();
              assert.equal(info.commit, process.env.EXPECTED_COMMIT);
              console.log(`Published docs v${info.version}: ${process.env.DOCS_URL}`);
              process.exit(0);
            } catch (error) { lastError = error; }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          throw new Error(`Published docs did not match this commit: ${lastError}`);
          NODE

