name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: forwardx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-upgrade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0.24", "8.0"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: forwardx-ci-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pforwardx-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify MySQL legacy upgrades and paced retention
        env:
          FORWARDX_TEST_MYSQL_URL: mysql://root:forwardx-ci-only@127.0.0.1:3306
          DATABASE_TYPE: mysql
        run: pnpm test:database-upgrade
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: |
            agent/go.mod
            forwardx-fxp/go.mod
            forwardx-fxp/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify panel
        run: |
          pnpm check:versions
          pnpm test:release-notes
          pnpm test:ui
          pnpm test:globe-ui
          pnpm test:list-settings
          pnpm test:resource-traffic
          pnpm test:security-boundaries
          pnpm test:login-ui
          pnpm test:startup
          pnpm test:support
          pnpm test:affiliates
          pnpm test:avatars
          pnpm test:latency-history
          pnpm test:agent-proxy
          pnpm test:deployment-docs
          pnpm test:ios
          pnpm test:i18n
          pnpm test:google-auth
          pnpm test:port-access-limits
          pnpm test:rule-groups
          pnpm test:rule-batch
          pnpm test:rule-tasks
          pnpm test:ai-models
          pnpm test:plan-display
          pnpm test:host-deletion
          pnpm test:host-notifications
          pnpm test:user-selection
          pnpm test:operations
          pnpm test:payments
          pnpm test:product-stock
          pnpm test:performance
          pnpm test:plugin-bbr
          pnpm exec tsc --noEmit
          pnpm build
          node --import tsx --test server/agentCrypto.test.ts
          node --import tsx --test server/tunnelProbeReporting.test.ts
          pnpm test:server
          pnpm test:ai
          pnpm test:selftest-dispatch
          pnpm docs:build

      - name: Verify Agent and FXP
        run: |
          gost_test_dir=$(mktemp -d)
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 https://github.com/go-gost/gost/releases/download/v3.2.6/gost_3.2.6_linux_amd64.tar.gz -o "$gost_test_dir/gost.tgz"
          tar -xzf "$gost_test_dir/gost.tgz" -C "$gost_test_dir"
          export FORWARDX_TEST_GOST_BINARY="$gost_test_dir/gost"
          (cd agent && go test ./... && go vet ./...)
          (cd forwardx-fxp && go test ./... && go vet ./...)

      - name: Verify TCP port limits in an isolated Linux network namespace
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iptables iproute2 util-linux
          port_limit_test_dir=$(mktemp -d)
          (cd agent && go test -c -o "$port_limit_test_dir/agent.test")
          sudo env FORWARDX_TEST_PORT_LIMITS=1 "$port_limit_test_dir/agent.test" -test.run '^TestPortAccessLimitsNetworkNamespace$' -test.v -test.timeout=90s
